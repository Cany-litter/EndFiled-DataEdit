version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: endfiled-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: endfiled
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: endfiled-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/endfiled?useUnicode=true&characterEncoding=UTF-8
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: endfiled-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
